<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Site</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111;
      font-family: Arial, sans-serif;
    }

    button {
      padding: 16px 32px;
      font-size: 20px;
      font-weight: bold;
      color: white;
      background: #5865f2;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }

    button:hover {
      background: #4752c4;
    }
  </style>
</head>

<body>

  <button onclick="openSite()">Open Site</button>

  <script>
    function openSite() {
      // Open a new blank tab
      const newWindow = window.open("about:blank", "_blank");

      // Put veck.io inside the blank page
      if (newWindow) {
        newWindow.document.write(`
          <!DOCTYPE html>
          <html>
          <head>
            <title>Site</title>
            <style>
              html, body {
                margin: 0;
                padding: 0;
                width: 100%;
                height: 100%;
                overflow: hidden;
                background: #000;
              }

              iframe {
                width: 100%;
                height: 100%;
                border: none;
              }
            </style>
          </head>
          <body>
            <iframe
              src="https://putlocker.uk/"
              allowfullscreen>
            </iframe>
          </body>
          </html>
        `);

        newWindow.document.close();
      }
    }
  </script>

</body>
</html>
