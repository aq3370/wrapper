<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Site</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #111;
      font-family: Arial, sans-serif;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #openButton {
      padding: 16px 32px;
      font-size: 20px;
      font-weight: bold;
      color: white;
      background: #5865f2;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }

    #openButton:hover {
      background: #4752c4;
    }
  </style>
</head>

<body>

  <button id="openButton">Open Site</button>

  <script>
    document.getElementById("openButton").addEventListener("click", function () {

      // Open a new blank tab
      const newWindow = window.open("about:blank", "_blank");

      if (!newWindow) {
        alert("Please allow popups for this site.");
        return;
      }

      // Build the blank page
      newWindow.document.open();

      newWindow.document.write(`
        <!DOCTYPE html>
        <html lang="en">
        <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0">
          <title>Site</title>

          <style>
            html,
            body {
              margin: 0;
              padding: 0;
              width: 100%;
              height: 100%;
              overflow: hidden;
              background: #000;
            }

            iframe {
              width: 100%;
              height: 100%;
              border: none;
            }
          </style>
        </head>

        <body>

          <iframe
            src="https://putlocker.uk/"
            sandbox="allow-scripts allow-same-origin allow-forms"
            allowfullscreen>
          </iframe>

        </body>
        </html>
      `);

      newWindow.document.close();
    });
  </script>

</body>
</html>
